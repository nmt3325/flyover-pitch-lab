name: FlyoverPitchLabIOS
options:
  minimumXcodeGenVersion: "2.38.0"
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  FlyoverPitchLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/FlyoverPitchLabIOS
      - path: Sources/FlyoverPitchLab/MapModel.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nmt3325.flyoverpitchlab.ios
        PRODUCT_NAME: FlyoverPitchLab
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: iOS/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_STYLE: Manual
        SUPPORTS_MACCATALYST: "NO"
        SKIP_INSTALL: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
